name: Bulong
options:
  bundleIdPrefix: com.armageddonvivas
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.4
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.0.0

targets:
  Bulong:
    type: application
    platform: macOS
    sources:
      - path: LocalTalk
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: WhisperKit
        product: WhisperKit
    info:
      path: LocalTalk/Support/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Bulong records your microphone to transcribe speech entirely on this Mac. Audio never leaves your computer."
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: Bulong
        NSPrincipalClass: NSApplication
    entitlements:
      path: LocalTalk/Support/LocalTalk.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armageddonvivas.Bulong
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets:
        - BulongTests
  BulongTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LocalTalkTests
    dependencies:
      - target: Bulong
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.armageddonvivas.BulongTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
